<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Portfolio-Keerthana</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: black;
            color: white;
            text-align: center;
        }

        /* NAVBAR */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: rgba(0, 0, 0, 0.8);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff4081;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: 500;
            transition: color 0.3s ease;
            text-shadow: 0 8px 20px rgba(255, 25, 178, 0.89);
        }

        nav ul li a:hover {
            color: #ff4081;
        }

        /* HAMBURGER */
        .menu-toggle {
            display: none;
            font-size: 1.8rem;
            color: white;
            cursor: pointer;
        }

        /* HERO */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 2s ease;
            box-shadow: 0 8px 20px rgba(255, 25, 178, 0.89);
        }

        .hero img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(246, 247, 248, 0.89);
            animation: imageAnimation 4s ease infinite alternate;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin: 20px 0 10px;
            animation: fadeIn 1.5s ease;
        }

        .hero h3 {
            font-size: 1.5rem;
            font-weight: normal;
            color: #ccc;
            animation: fadeIn 1.5s ease;
        }

        .social-icons {
            margin-top: 30px;
        }

        .social-icons a {
            color: white;
            font-size: 1.8rem;
            margin: 0 15px;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-icons a:hover {
            color: #ff4081;
            transform: scale(1.2);
        }

        /* ANIMATIONS (UNCHANGED) */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes imageAnimation {
            from { transform: translateY(0px) scale(1); }
            to { transform: translateY(-15px) scale(1.05); }
        }

        .text {
            color: #ff4081;
            text-shadow: 0 8px 20px rgba(236, 31, 31, 0.89);
            animation: fadeIn 2s ease infinite alternate;
        }

        /* MOBILE RESPONSIVE */
        @media screen and (max-width: 768px) {

            .menu-toggle {
                display: block;
            }

            nav {
                padding: 15px 25px;
            }

            nav ul {
                position: absolute;
                top: 65px;
                left: 0;
                width: 100%;
                background: rgba(0, 0, 0, 0.95);
                flex-direction: column;
                align-items: center;
                gap: 20px;
                padding: 20px 0;
                display: none;
                animation: fadeIn 0.5s ease;
            }

            nav ul.active {
                display: flex;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero h3 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">Keerthana</div>

        <div class="menu-toggle" id="menu-toggle">
            <i class="fas fa-bars"></i>
        </div>

        <ul id="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="aboutme.html">ABOUT</a></li>
            <li><a href="education.html">EDUCATION</a></li>
            <li><a href="projects.html">PROJECTS</a></li>
            <li><a href="certifications.html">CERTIFICATIONS</a></li>
        </ul>
    </nav>

    <section class="hero">
        <img src="images/Keerthana.jpeg" alt="kishor">
        <h1>Hi, I'm <span class="text">Keerthana</span></h1>
        <h3>I'M MCA Graduate</h3>

        <div class="social-icons">
            <a href="https://www.linkedin.com/in/keerthana-achar-a3b6202b1"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/Keerthanaachar16"><i class="fab fa-github"></i></a>
            <a href="#"><i class="fab fa-whatsapp"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
    </section>

    <script>
        const menuToggle = document.getElementById("menu-toggle");
        const navLinks = document.getElementById("nav-links");

        menuToggle.addEventListener("click", () => {
            navLinks.classList.toggle("active");
        });
    </script>

</body>
</html>
